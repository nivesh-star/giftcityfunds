<!-- Vercel Web Analytics -- plain-HTML snippet (no npm package needed for
     a non-Next.js app). The queue stub must run before the deferred
     script loads so any early page-view call isn't dropped. This only
     actually collects data once Web Analytics is turned on for this
     project in the Vercel dashboard (Project -> Analytics -> Enable);
     until then it's a harmless no-op. Included on every page from this
     one partial so the snippet only ever needs to change in one place. -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

  // Shared custom-event helper (Vercel Web Analytics' track() API) -- every
  // page includes this partial, so any template/script can call
  // window.gaTrack('Fund Viewed', {fund_id: 172}) etc. without redefining
  // it. A no-op until Web Analytics is enabled for this project (same as
  // window.va itself above).
  window.gaTrack = function (name, data) {
    window.va('event', data ? { name, data } : { name });
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>
