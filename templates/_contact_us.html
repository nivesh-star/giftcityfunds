<!-- Contact Us -- phone + email dropdown, self-contained (button, panel,
     and the JS that opens/closes it) so any nav can pull it in with a
     single include. -->
<div class="relative shrink-0">
  <button type="button" id="contactUsBtn" class="inline-flex items-center gap-1.5 px-2.5 xl:px-3 py-1.5 rounded-lg text-xs font-bold text-[var(--color-text-muted)] hover:text-blue-400 transition-colors whitespace-nowrap shrink-0">
    <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    <span class="hidden sm:inline">Contact Us</span>
  </button>
  <div id="contactUsPanel" class="hidden absolute right-0 top-full mt-2 w-64 rounded-2xl border border-[var(--color-border)] bg-[var(--color-card)] shadow-2xl p-3 z-50">
    <p class="text-[10px] font-bold uppercase tracking-widest text-[var(--color-text-subtle)] px-2 pt-1 pb-2">Get in touch</p>
    <a href="tel:+917009648426" class="flex items-center gap-3 p-2 rounded-xl hover:bg-[var(--color-card-hover)] transition-colors group">
      <span class="w-9 h-9 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
      </span>
      <span class="min-w-0">
        <span class="block text-xs font-bold text-[var(--color-text)] group-hover:text-blue-400 transition-colors">Call us</span>
        <span class="block text-[11px] text-[var(--color-text-subtle)] font-mono">+91 70096 48426</span>
      </span>
    </a>
    <a href="mailto:giftcityfunds@gmail.com" class="flex items-center gap-3 p-2 rounded-xl hover:bg-[var(--color-card-hover)] transition-colors group mt-1">
      <span class="w-9 h-9 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      </span>
      <span class="min-w-0">
        <span class="block text-xs font-bold text-[var(--color-text)] group-hover:text-emerald-400 transition-colors">Email us</span>
        <span class="block text-[11px] text-[var(--color-text-subtle)] break-all">giftcityfunds@gmail.com</span>
      </span>
    </a>
  </div>
</div>
<script>
  (function () {
    var btn = document.getElementById('contactUsBtn');
    var panel = document.getElementById('contactUsPanel');
    if (!btn || !panel) return;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      panel.classList.toggle('hidden');
    });
    document.addEventListener('click', function (e) {
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== btn) {
        panel.classList.add('hidden');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') panel.classList.add('hidden');
    });
  })();
</script>
