<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | GIFT360</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'gcf-blue': '#2563eb',
            'gcf-blue-dark': '#1d4ed8',
            'gcf-neon': '#79FE0C',
            'gcf-neon-dark': '#67e600',
            'fin-dark': '#0b0f19',
            'fin-card': '#131d31',
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/static/css/custom.css" />
  <script>
    (function () {
      var t = localStorage.getItem('gift360-theme') || 'dark';
      document.documentElement.classList.add(t);
      document.documentElement.classList.remove(t === 'light' ? 'dark' : 'light');
    })();
  </script>
</head>
<body class="min-h-screen flex items-center justify-center px-4" style="background-color: var(--color-bg); color: var(--color-text);">

  <div class="w-full max-w-sm">

    <a href="/" class="flex items-center justify-center gap-2 mb-6">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-blue-700 flex items-center justify-center shadow-md shadow-blue-500/20 text-white font-black text-lg">G</div>
      <span class="font-extrabold text-xl tracking-tight">GIFT<span class="text-blue-500">360</span></span>
    </a>

    <div class="glass-card rounded-2xl p-6 border border-[var(--color-border)]">
      <h1 class="text-lg font-black mb-1">Create your account</h1>
      <p class="text-xs text-[var(--color-text-subtle)] mb-5">Set up a simulated portfolio -- demo only, no real money or KYC involved.</p>

      {% if error %}
      <div class="mb-4 text-xs font-semibold px-3 py-2 rounded-lg" style="background: rgba(239,68,68,0.12); color: #ef4444; border: 1px solid rgba(239,68,68,0.3);">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wide text-[var(--color-text-subtle)] mb-1">Full Name</label>
          <input type="text" name="full_name" required value="{{ full_name }}" placeholder="Your name" class="w-full bg-[var(--color-bg-subtle)] border border-[var(--color-border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-all" />
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wide text-[var(--color-text-subtle)] mb-1">Email</label>
          <input type="email" name="email" required value="{{ email }}" placeholder="you@email.com" class="w-full bg-[var(--color-bg-subtle)] border border-[var(--color-border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-all" />
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wide text-[var(--color-text-subtle)] mb-1">Password</label>
          <input type="password" name="password" required minlength="8" placeholder="At least 8 characters" class="w-full bg-[var(--color-bg-subtle)] border border-[var(--color-border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-all" />
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wide text-[var(--color-text-subtle)] mb-1">Confirm Password</label>
          <input type="password" name="confirm_password" required minlength="8" placeholder="••••••••" class="w-full bg-[var(--color-bg-subtle)] border border-[var(--color-border)] rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-all" />
        </div>
        <button type="submit" class="btn-neon w-full text-sm px-4 py-2.5 rounded-xl font-bold mt-2">Create Account</button>
      </form>

      <p class="text-center text-xs text-[var(--color-text-subtle)] mt-4">
        Already have an account? <a href="/login" class="text-blue-400 hover:text-blue-300 font-semibold">Sign in</a>
      </p>
    </div>

    <a href="/" class="block text-center mt-5 text-xs text-[var(--color-text-subtle)] hover:text-blue-400">← Back to dashboard</a>
  </div>

</body>
</html>
