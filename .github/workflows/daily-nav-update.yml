name: Daily NAV Update

# Pulls today's real, published NAV from each AMC's own official GIFT City
# site (HDFC, Sundaram, PPFAS, DSP) and commits it straight into
# gift_city_amc_funds.db. Never invents a value -- if a source is down or
# its response looks unexpected, that fund is skipped for the day (see
# scripts/daily_nav_update.py). A push to main auto-deploys to Render.

on:
  schedule:
    # 15:00 UTC = 20:30 IST -- after GIFT City NAVs are typically published.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run daily NAV feeder
        run: python3 scripts/daily_nav_update.py

      - name: Commit and push if the database changed
        run: |
          if git diff --quiet -- gift_city_amc_funds.db; then
            echo "No NAV changes today -- nothing to commit."
            exit 0
          fi
          git config user.name "gift-city-nav-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gift_city_amc_funds.db
          git commit -m "Daily NAV update: $(date -u +'%Y-%m-%d')"
          git push
